name: DEV-Lint

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths-ignore: ['.github/workflows/**']
  push:
    branches: [develop]
    paths-ignore: ['.github/workflows/**']

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@woof-software'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: tsc --noEmit

      - name: Build
        run: npm run build
